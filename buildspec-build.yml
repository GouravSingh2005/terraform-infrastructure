version: 0.2

env:
  shell: bash

  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_CLI_ARGS: "-no-color"

phases:
  install:
    commands:
      # Install unzip
      - apt-get update
      - apt-get install -y unzip curl

      # Install Terraform
      - TF_VERSION="1.8.5"
      - curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"

      - unzip -o /tmp/terraform.zip -d /usr/local/bin

      - terraform version

  pre_build:
    commands:
      # Terraform backend init
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${TF_STATE_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}" -backend-config="encrypt=true"

  build:
    commands:
      # Terraform format check
      - terraform fmt -check -recursive

artifacts:
  files:
    - "**/*"

  exclude-paths:
    - ".terraform/**"
    - ".git/**"
    - "*.tfstate*"