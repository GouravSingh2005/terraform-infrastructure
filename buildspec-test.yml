########################################
# CODEBUILD TEST SPECIFICATION
########################################
# Test stage: Configuration validation and infrastructure planning.
# Generates tfplan artifact for deploy stage.
version: 0.2

env:
  shell: bash
  # Environment variables for Terraform automation
  # TF_IN_AUTOMATION disables interactive prompts
  # TF_INPUT=false prevents Terraform from asking for input
  # TF_CLI_ARGS=-no-color ensures consistent log output
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_CLI_ARGS: "-no-color"
phases:
  install:
    commands:
      # Download and install Terraform CLI
      - yum install -y unzip
      - TF_VERSION="1.8.5"
      - curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o /tmp/terraform.zip -d /usr/local/bin
      - terraform version
  pre_build:
    commands:
      # Initialize Terraform backend with S3 and DynamoDB locking
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${TF_STATE_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}" -backend-config="encrypt=true"
  build:
    commands:
      # Validate Terraform syntax and generate plan for review
      - terraform validate
      - terraform plan -input=false -out=tfplan
artifacts:
  files:
    - "**/*"
  exclude-paths:
    - ".terraform/**"
    - ".git/**"
    - "*.tfstate*"
